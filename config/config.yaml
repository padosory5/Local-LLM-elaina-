############################################################
# Elaina Configuration
#
# Changing a provider here only works after its Python
# integration has been implemented.
#
# Currently implemented:
#   LLM: Ollama
#   TTS: Piper
############################################################


############################################################
# Large Language Model
############################################################

llm:
  # Active LLM provider.
  #
  # Current:
  #   ollama
  #
  # Possible future providers:
  #   openai
  #   anthropic
  #   openrouter
  #   llama_cpp
  provider: "ollama"

  ##########################################################
  # Ollama
  #
  # Local LLM server:
  #   http://localhost:11434
  #
  # Example model names:
  #   qwen3:8b
  #   qwen3:14b
  #   qwen3:30b
  #   gemma3:27b
  #   mistral-small
  #
  # Install models using:
  #   ollama pull qwen3:8b
  ##########################################################

  ollama:
    # 127.0.0.1, not "localhost" -- on this machine "localhost" resolves to
    # the IPv6 loopback (::1) first, and Ollama isn't reachable there, so
    # every single call pays a ~2s IPv6-then-IPv4-fallback tax before even
    # reaching the server. A multi-step task makes many sequential calls
    # (router, task intent gate, task planner per step, each tier-2
    # planner's own rounds), so that tax was most of the wait the user saw.
    base_url: "http://127.0.0.1:11434"
    # Fast text-only model used for normal conversation.
    model: "qwen3:8b"

    # Sampling temperature, generally between 0 and 2.
    # Lower values are more predictable.
    # Higher values are more creative.
    temperature: 0.8

    # Number of seconds Ollama keeps the model loaded.
    # Use -1 to keep it loaded indefinitely.
    keep_alive: -1

  ##########################################################
  # OpenAI
  #
  # Store the real API key in your .env file:
  #   OPENAI_API_KEY=your-key
  #
  # Do not place the actual key in this YAML file.
  ##########################################################

  openai:
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    organization_id_env: "OPENAI_ORGANIZATION_ID"
    project_id_env: "OPENAI_PROJECT_ID"
    model: ""
    temperature: 0.8

  ##########################################################
  # Anthropic
  #
  # Store the API key in .env:
  #   ANTHROPIC_API_KEY=your-key
  ##########################################################

  anthropic:
    base_url: "https://api.anthropic.com"
    api_key_env: "ANTHROPIC_API_KEY"
    model: ""
    temperature: 0.8

  ##########################################################
  # OpenRouter
  #
  # Store the API key in .env:
  #   OPENROUTER_API_KEY=your-key
  #
  # OpenRouter provides an OpenAI-compatible API for many
  # hosted model providers.
  ##########################################################

  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    model: ""
    temperature: 0.8

  ##########################################################
  # llama.cpp
  #
  # Local inference using a GGUF model.
  #
  # Example:
  #   model_path: "C:/Models/model.gguf"
  ##########################################################

  llama_cpp:
    model_path: ""
    context_length: 8192
    gpu_layers: -1
    temperature: 0.8

############################################################
# User
#
# Where the user actually lives. This decides which shops,
# services, and websites Elaina recommends, and which market
# she assumes when a request names no place at all.
#
# Without this, every recommendation quietly defaults to
# United States sites regardless of who is asking.
############################################################

user:
  # ISO country code (KR, US, JP, GB, ...), or "auto" to read
  # it from the Windows regional settings on startup.
  country: "auto"

  # Optional. Used for "near me"-style requests and spoken as
  # part of Elaina's own sense of where you are.
  city: ""

  # Leave blank to use the country's normal currency.
  currency: ""

  # Language Elaina searches in when local sources are in it.
  # Blank follows the country. She still answers in your
  # language regardless of what she reads.
  search_language: ""

  # Optional overrides for the built-in per-country site table
  # in brain/user_locale.py. Anything set here wins.
  # Known categories: hotel, restaurant, secondhand, shopping,
  # gpu, car, flight, job, realestate.
  preferred_sites: {}
  # preferred_sites:
  #   secondhand:
  #     - "당근마켓"
  #     - "번개장터"


############################################################
# Language
############################################################

language:
  # Elaina's response language.
  #
  # en = English
  # ko = Korean
  response: "en"


############################################################
# Voice Response Length
############################################################

responses:
  # These limits are passed to Ollama as generation/rewrite requirements.
  # TextFilter never slices a generated answer. If a short rewrite would lose
  # the requested result, Elaina keeps the complete answer instead.
  max_words: 45
  max_sentences: 2
  detailed_max_words: 220
  detailed_max_sentences: 8

  # Short Ollama-generated acknowledgement before a slower agent starts.
  status_max_words: 6


############################################################
# Semantic Routing Safety
############################################################

routing:
  # enforce: block vague conversation from project-edit tools
  # shadow: log what would be blocked without changing the route
  # off: legacy routing behavior (temporary rollback only)
  project_edit_safety: "enforce"

  # Optional agent offers expire so a later unrelated "yes" cannot start an
  # old task. The router also clears an offer when the user changes topics.
  agent_offer_expiry_seconds: 300

  # Below this confidence, an ability-boundary decision (web_search vs.
  # computer_action) asks a short clarifying question instead of guessing.
  confidence_medium_threshold: 0.5
  confidence_clarification_enabled: true

  # How long a paused multi-step task (Phase 4D-1) waits for the user to
  # confirm a committing step before it's dropped, same pattern as
  # agent_offer_expiry_seconds/computer_control.consent_expiry_seconds above.
  task_confirmation_expiry_seconds: 90

  # How long a pre-first-step strategy offer ("I could check a specialized
  # website directly -- want me to?") waits for the user's answer before
  # it's dropped, same pattern as task_confirmation_expiry_seconds above.
  task_strategy_offer_expiry_seconds: 90

  # How long a plain conversational ability offer ("I can check that in
  # the browser -- want me to?") stays answerable. Longer than the two
  # above because it interrupts nothing: the user is free to think about
  # it, and a stale "sure" much later must still not start an action.
  capability_offer_expiry_seconds: 120


############################################################
# Bounded Windows Computer Control
############################################################

computer_control:
  # Phase 4A discovers registered Windows applications instead of maintaining
  # an application-name allowlist. App and process descriptors always come
  # from local discovery, never from model-generated commands or paths.
  enabled: true

  ##########################################################
  # How Elaina operates applications (Phase 4F)
  #
  #   screen -- She moves the real mouse pointer and types
  #             real keystrokes, the same way you would.
  #             This is the only way to operate apps that
  #             draw their own interface -- Spotify,
  #             Discord, Battle.net and similar expose no
  #             typable field to Windows at all, so the
  #             "uia" driver below can only click near one
  #             and type blind.
  #
  #             An explicit user task starts immediately;
  #             there is no separate pointer-takeover prompt.
  #             Physical mouse or keyboard input during a
  #             run remains an immediate emergency stop.
  #
  #   uia    -- The Phase 4B driver: invoke controls through
  #             the accessibility layer without moving the
  #             pointer. Never competes with you for the
  #             mouse, but cannot type into many modern apps
  #             and cannot operate anything unnamed.
  ##########################################################
  driver: "screen"

  # Computer Control Mode starts OFF on every launch and is enabled only by
  # the visible Electron toggle. This timeout applies to the separate pending
  # confirmation required for force-quit and Recycle Bin deletion.
  consent_expiry_seconds: 90

  # Empty item creation and recoverable deletion are restricted to these
  # Windows Known Folders. Absolute paths may be added when another root is
  # trusted. Existing items are never overwritten; deletions use Recycle Bin.
  allowed_file_roots:
    - "Desktop"
    - "Documents"
    - "Downloads"

  # Keep localhost and private-network browser navigation disabled unless the
  # user deliberately enables it for local development tools.
  allow_local_urls: false

  # Used for "open the browser and search for X" -- a fresh tab with no
  # specific site named. The domain here is fixed by this config, never
  # model-invented; only the query text (always percent-encoded) is filled
  # into {query}. Change this to your preferred search engine.
  default_search_url: "https://www.google.com/search?q={query}"

  # Optional spoken aliases for portable or unusually named applications.
  # The value must match the application's discovered Windows display name.
  aliases: {}
  # aliases:
  #   code: "Visual Studio Code"


############################################################
# Browser Control (Phase 4C)
############################################################

browser_control:
  enabled: true

  ##########################################################
  # Which driver operates the browser (Phase 4E)
  #
  #   screen -- Elaina operates the browser window you
  #             already have open, or launches the registered
  #             default browser when no window exists. She
  #             reads the live page through Windows UI
  #             Automation and moves the real mouse and
  #             keyboard; your visible session and profile
  #             remain the ones in use. A full page
  #             observation takes about 0.1 seconds.
  #             Measured against the cdp driver below, which
  #             budgets up to 15 seconds just to start its
  #             own browser first.
  #
  #   cdp    -- The Phase 4C driver: launch a separate,
  #             isolated, logged-out browser profile and
  #             control it over the Chrome DevTools
  #             Protocol. Slower and it cannot use your
  #             sessions, but it can read link targets and
  #             operate pages whose accessibility tree never
  #             becomes available.
  #
  # The safety rules are identical either way: credential
  # and payment controls are refused, committing controls
  # need confirmation, and page content is never treated as
  # an instruction.
  ##########################################################
  driver: "screen"

  # screen driver only. Adds --force-renderer-accessibility to browsers
  # Elaina starts herself, so their page tree is exposed immediately
  # instead of only after something queries it. It has no effect on a
  # browser that was already running.
  force_accessibility: true

  # cdp driver only. Elaina opens pages she needs to operate in this
  # Chromium-based browser, using a private browser profile and the Chrome
  # DevTools Protocol. Must match the browser's discovered Windows display
  # name (the same discovery Phase 4A/4B use for computer_control).
  browser_name: "Whale"

  # The remote port binds only to localhost. A dedicated profile is required
  # by current Chromium releases and prevents normal browsing data from being
  # exposed through automation. Leave this blank to use Elaina's private
  # runtime profile; set an absolute path only if you want to manage it.
  remote_debugging_port: 9222
  user_data_dir: ""


############################################################
# Text-to-Speech
############################################################

tts:
  # Active TTS provider.
  #
  # Current:
  #   piper
  #
  # Possible future providers:
  #   xtts
  #   elevenlabs
  #   fish_speech
  #   edge_tts
  provider: "piper"

  ##########################################################
  # Piper
  #
  # Current local TTS implementation.
  #
  # The matching model JSON file should normally be stored
  # beside the ONNX model.
  ##########################################################

  piper:
    executable: "C:/Users/pados/piper/piper.exe"
    model: "C:/Users/pados/piper/voices/en_US-amy-medium.onnx"

  ##########################################################
  # XTTS
  #
  # Possible future local multilingual and voice-cloning TTS.
  #
  # speaker_wav should point to a clean reference recording.
  ##########################################################

  xtts:
    model: "tts_models/multilingual/multi-dataset/xtts_v2"
    speaker_wav: ""
    language: "en"
    device: "cuda"

  ##########################################################
  # ElevenLabs
  #
  # Store the API key in .env:
  #   ELEVENLABS_API_KEY=your-key
  ##########################################################

  elevenlabs:
    api_key_env: "ELEVENLABS_API_KEY"
    voice_id: "9wV7LnFitDJZcfhwO7gm"
    model: "eleven_v3"
    output_format: "mp3_44100_128"

  ##########################################################
  # Fish Speech
  #
  # Possible future local expressive TTS.
  ##########################################################

  fish_speech:
    model_path: ""
    reference_audio: ""
    reference_text: ""
    device: "cuda"

  ##########################################################
  # Microsoft Edge TTS
  #
  # Possible future online TTS provider.
  ##########################################################

  edge_tts:
    voice: "en-US-JennyNeural"
    rate: "+0%"
    pitch: "+0Hz"
    volume: "+0%"


############################################################
# Speech-to-Text
############################################################

stt:
  provider: "faster_whisper"

  faster_whisper:
    model_size: "small"

    # Use null for automatic detection. Detected languages outside the
    # allowlist below are retried as English instead of accepting a random
    # Japanese or other-language hallucination from unclear microphone audio.
    language: null
    allowed_languages:
      - "en"
      - "ko"
    language_retry_threshold: 0.60

    device: "cuda"
    compute_type: "float16"

    # If GPU transcription fails, Elaina currently falls
    # back to CPU automatically.
    cpu_compute_type: "int8"

    # Keep this empty. A long initial prompt can be repeated verbatim when
    # Whisper receives a quiet or unclear clip.
    initial_prompt: ""

    # Discard segments that Whisper itself considers silence and low quality.
    no_speech_threshold: 0.60
    log_probability_threshold: -1.0


############################################################
# Voice Activity Detection
############################################################

vad:
  provider: "silero"

  silero:
    sample_rate: 16000
    threshold: 0.35
    silence_ms: 900
    minimum_speech_ms: 180
    pre_speech_ms: 300
    start_timeout_seconds: 15
    maximum_recording_seconds: 30

    # A numeric index overrides the name-based selection below. Keep this null
    # because Windows device indices can change after a reboot.
    device_index: null

    # Select the headset microphone through WASAPI. Elaina captures at the
    # device's native rate and resamples to Silero's 16 kHz automatically.
    # The input stream opens once during startup and remains active until
    # Elaina exits, which prevents wireless-headset idle shutdown between turns.
    device_name: "PRO X 2 LIGHTSPEED"
    preferred_host_api: "Windows WASAPI"
    capture_sample_rate: null


############################################################
# Memory
############################################################

memory:
  enabled: true

  # Maximum number of raw candidates retrieved before ranking.
  top_k: 20

  # Default importance assigned to newly stored memories.
  default_importance: 5


############################################################
# Screen Vision
############################################################

vision:
  # A fresh screenshot is captured only for an explicit screen-related request.
  # Elaina does not record continuously or write screenshots to disk.
  enabled: true

  # Used only for explicit screen questions. Keeping it separate prevents
  # normal conversation from paying the vision model's image-processing cost.
  model: "qwen3-vl:8b"

  # Keep Qwen3-VL loaded briefly so repeated screen requests do not reload the
  # entire model. Ollama may still evict it if VRAM is needed.
  keep_alive: "10m"

  # 1 is the first physical monitor; use 2 for a second monitor.
  monitor_index: 1

  # Smaller images reduce visual-token processing time.
  maximum_width: 960
  jpeg_quality: 60


############################################################
# Web Search
############################################################

search:
  enabled: true
  provider: "duckduckgo"
  cache_seconds: 300
  cache_entries: 20

  duckduckgo:
    max_results: 3
    timeout_seconds: 10

  # Possible future Tavily configuration.
  # Store the key in .env:
  #   TAVILY_API_KEY=your-key
  tavily:
    api_key_env: "TAVILY_API_KEY"
    max_results: 3


############################################################
# Reverse Image Search
############################################################

visual_search:
  # Used only when the screen request asks Elaina to identify an exact person,
  # game, product, landmark, vehicle, logo, or other entity. Direct tasks such
  # as translation and code explanation remain local with Qwen3-VL.
  enabled: true
  provider: "google_cloud_vision"

  google_cloud_vision:
    # Store the credential JSON outside this project. The startup batch file
    # should set this environment variable to the full credential path.
    credentials_env: "GOOGLE_APPLICATION_CREDENTIALS"

    # Limit the amount of retrieval evidence placed into the final prompt.
    max_results: 8

    # Local safety limit for Elaina. Google currently provides 1,000 free
    # Cloud Vision feature units per month, so 900 leaves a buffer. This counter
    # covers Elaina only; also configure a Cloud billing budget/alert.
    monthly_request_limit: 900
    usage_file: "runtime/data/visual_search_usage.json"

    # Reusing the exact same selected image does not consume another request
    # while Elaina remains open.
    cache_seconds: 86400


############################################################
# Google Calendar Agent
############################################################

calendar:
  google:
    # Prefer setting this in .env:
    # GOOGLE_CALENDAR_CREDENTIALS=C:/path/to/oauth-client.json
    #
    # This must be an OAuth client created for a Desktop application.
    # The authorized user token is stored privately under runtime/secrets.
    credentials_file: ""


############################################################
# Local Project Access (read-only MCP)
############################################################

project_access:
  # When enabled, Elaina can inspect this one project only.
  # Use forward slashes in Windows paths so YAML stays easy to read.
  enabled: true
  # "." means this Elaina project. You may replace it with another folder.
  project_root: "."

  # Prevent the local model from repeatedly calling project tools.
  # Normal conversations do not use these rounds at all.
  max_tool_rounds: 3


############################################################
# Time Context
############################################################

time:
  enabled: true

  # Use "local" to use the operating system's local time.
  # You can later use an IANA name such as "Asia/Seoul"
  # when the tzdata package is installed.
  timezone: "local"

  use_12_hour_clock: true


############################################################
# Avatar
############################################################

avatar:
  enabled: false
  provider: "unity"

  unity:
    host: "127.0.0.1"
    websocket_port: 8765


############################################################
# Debugging
############################################################

debug:
  print_events: false
  print_memory: false
  print_search: true
  print_tool_calls: true
  print_timings: true
  print_router_confidence: true
